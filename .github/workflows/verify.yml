name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      BRC_DELEGATE_INSTALLER_SANDBOX: "1"
    steps:
      - name: Install Arch CI dependencies
        run: pacman -Syu --noconfirm git python
      - uses: actions/checkout@v4
      - name: Verify public tree
        run: ./scripts/verify-public-tree.sh

  installer-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces
        run: |
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify Bubblewrap namespace support
        run: |
          bwrap             --die-with-parent             --unshare-all             --ro-bind / /             /bin/true

      - name: Zero-network installer audit
        run: ./tests/test_installer_sandbox.sh
